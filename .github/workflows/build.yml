name: Build Android App (APK & AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Re-create Android Project Files
        run: flutter create . --platforms=android

      - name: Add Internet & Location Permissions
        run: |
          sed -i '/<manifest/a \  <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>' android/app/src/main/AndroidManifest.xml

      - name: Fix minSdkVersion for connectivity_plus
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk 21/' android/app/build.gradle
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK & AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
